<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mã xác thực MetroTicket</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2933;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 8px;
        padding: 32px;
      "
    >
      <tr>
        <td>
          <h2 style="margin: 0 0 16px; color: #0b5394">MetroTicket</h2>

          <p>Mã xác thực của bạn là:</p>

          <p
            style="
              font-size: 32px;
              font-weight: bold;
              letter-spacing: 8px;
              margin: 16px 0;
            "
            th:text="${code}"
          >
            123456
          </p>

          <p>
            Mã có hiệu lực trong
            <strong th:text="${minutes}">10</strong> phút.
          </p>

          <p style="color: #7b8794; font-size: 13px">
            Không chia sẻ mã này cho bất kỳ ai. Nếu bạn không yêu cầu, hãy bỏ
            qua email này.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>

spring.application.name=metroticket-api

# Nạp biến từ file .env khi chạy local (mvn spring-boot:run, IDE). Docker dùng env_file nên không cần.
spring.config.import=optional:file:.env[.properties]

#database (postgres + flyway)

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/metroticket}
spring.datasource.username=${DB_USERNAME:metroticket}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Nạp collection (roles, permissions) theo lô 50 bản ghi → tránh N+1 khi phân trang
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# redis (danh sách access token đã đăng xuất)

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Timeout ngắn: Redis chết thì request không bị treo 60s (mặc định của Lettuce)
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

# cors (danh sách origin của frontend, phân cách bằng dấu phẩy)

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# mail

spring.mail.host = ${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.default-encoding=UTF-8
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout= 5000
spring.mail.properties.mail.smtp.timeout= 5000
spring.mail.properties.mail.smtp.writetimeout= 5000

app.mail.from=${SMTP_FROM_ADDRESS}
app.mail.from-name=${SMTP_FROM_NAME:MetroTicket}


# ma xac nhan

app.verification.hash-key=${EMAIL_VERIFICATION_HASH_KEY}
app.verification.lifetime=10m
app.verification.resend-cooldown=60s
app.verification.max-failed-attempts=5

#jwt & phan quyen

app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.issuer=metroticket-api
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=14d
app.auth.login-max-failures=10
app.auth.login-lock-duration=15m
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# du lieu mau de test: chi bat o local/dev (xem DemoDataSeeder)
app.seed.demo-data=${SEED_DEMO_DATA:false}
app.seed.file=${SEED_FILE:file:seed/demo-users.json}

# JSON của Page ổn định: {content, page:{size, number, totalElements, totalPages}}
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100

# ===== Spring AI (đang có trong pom) =====
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:chua-cau-hinh}

# ===== Actuator =====
management.endpoints.web.exposure.include=health
management.health.mail.enabled=true
spring.application.name=metroticket-api

# Nạp biến từ file .env khi chạy local (mvn spring-boot:run, IDE). Docker dùng env_file nên không cần.
spring.config.import=optional:file:.env[.properties]

#database (postgres + flyway)

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/metroticket}
spring.datasource.username=${DB_USERNAME:metroticket}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Nạp collection (roles, permissions) theo lô 50 bản ghi → tránh N+1 khi phân trang
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# redis (danh sách access token đã đăng xuất)

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Timeout ngắn: Redis chết thì request không bị treo 60s (mặc định của Lettuce)
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

# cors (danh sách origin của frontend, phân cách bằng dấu phẩy)

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# mail

spring.mail.host = ${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.default-encoding=UTF-8
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout= 5000
spring.mail.properties.mail.smtp.timeout= 5000
spring.mail.properties.mail.smtp.writetimeout= 5000

app.mail.from=${SMTP_FROM_ADDRESS}
app.mail.from-name=${SMTP_FROM_NAME:MetroTicket}


# ma xac nhan

app.verification.hash-key=${EMAIL_VERIFICATION_HASH_KEY}
app.verification.lifetime=10m
app.verification.resend-cooldown=60s
app.verification.max-failed-attempts=5

#jwt & phan quyen

app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.issuer=metroticket-api
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=14d
app.auth.login-max-failures=10
app.auth.login-lock-duration=15m
app.bootstrap.admin-email=${ADMIN_EMAIL:}
spring.flyway.placeholders.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# du lieu mau de test: chi bat o local/dev (xem DemoDataSeeder)
app.seed.demo-data=${SEED_DEMO_DATA:false}
app.seed.file=${SEED_FILE:file:seed/demo-users.json}

# JSON của Page ổn định: {content, page:{size, number, totalElements, totalPages}}
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100

# ===== External data providers =====
# Bus provider: EBMS bus info API from HCMC.
# Base URL thực tế theo nhà cung cấp: http://apicms.ebms.vn
# Endpoint route chính: /businfo/getallroute
# Endpoint trạm gần: /businfo/getstopsinbounds/{lng1}/{lat1}/{lng2}/{lat2}
app.external.bus.base-url=${APP_EXTERNAL_BUS_BASE_URL:https://apicms.ebms.vn}
app.external.bus.routes-path=${APP_EXTERNAL_BUS_ROUTES_PATH:/businfo/getallroute}
app.external.bus.nearby-stops-path=${APP_EXTERNAL_BUS_NEARBY_STOPS_PATH:/businfo/getstopsinbounds}
# Geoapify Places API. Configure GEOAPIFY_API_KEY in the environment or local .env.
app.external.geoapify.base-url=${APP_EXTERNAL_GEOAPIFY_BASE_URL:https://api.geoapify.com}
app.external.geoapify.places-path=${APP_EXTERNAL_GEOAPIFY_PLACES_PATH:/v2/places}
app.external.geoapify.api-key=${GEOAPIFY_API_KEY:}
# Cấu hình TTL cache theo độ thay đổi dữ liệu ngoài.
app.external.cache.bus-nearby-ttl-minutes=${APP_EXTERNAL_CACHE_BUS_NEARBY_TTL_MINUTES:15}
app.external.cache.bus-routes-ttl-minutes=${APP_EXTERNAL_CACHE_BUS_ROUTES_TTL_MINUTES:30}
app.external.cache.facility-nearby-ttl-minutes=${APP_EXTERNAL_CACHE_FACILITY_NEARBY_TTL_MINUTES:60}

# ===== Spring AI (đang có trong pom) =====
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:chua-cau-hinh}

# ===== Actuator =====
management.endpoints.web.exposure.include=health
management.health.mail.enabled=true

# Lưu ảnh banner trên S3 hoặc MinIO. Tắt thì app dùng ảnh có sẵn
app.storage.s3.enabled=${S3_ENABLED:false}
app.storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.bucket=${S3_BUCKET:metroticket}
app.storage.s3.access-key=${S3_ACCESS_KEY:${MINIO_ROOT_USER:}}
app.storage.s3.secret-key=${S3_SECRET_KEY:${MINIO_ROOT_PASSWORD:}}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# ===== Thanh toán =====
# CHỈ bật ở dev: cho phép CARD/E_WALLET/BANK_TRANSFER mua online "thành công ngay" không qua cổng thanh toán
app.payment.mock-enabled=${PAYMENT_MOCK_ENABLED:false}
# SePay: chuyển khoản VietQR, SePay báo về qua webhook POST {BASE_URL}/api/v1/payments/sepay/webhook
app.payment.sepay.enabled=${SEPAY_ENABLED:false}
app.payment.sepay.bank=${SEPAY_BANK:}
app.payment.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
app.payment.sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:}
# Một trong hai: API Key (Authorization: Apikey ...) hoặc HMAC secret (ưu tiên). Để trống cả hai = từ chối mọi webhook
app.payment.sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
app.payment.sepay.webhook-hmac-secret=${SEPAY_WEBHOOK_HMAC_SECRET:}
# Khai báo trên SePay: Công ty → Cấu hình chung → Cấu trúc mã thanh toán = tiền tố MTQ + 8 ký tự chữ/số
app.payment.sepay.code-prefix=${SEPAY_CODE_PREFIX:MTQ}

# ===== AI: xác thực sinh viên bằng Gemini (Google AI Studio) =====
# Không có key → hồ sơ chuyển thẳng sang duyệt tay (ADMIN/MANAGER)
app.ai.gemini.enabled=${GEMINI_ENABLED:false}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.gemini.api-revision=${GEMINI_API_REVISION:2026-05-20}
app.ai.gemini.read-timeout=${GEMINI_READ_TIMEOUT:90s}
# Số lời gọi AI song song (free tier giới hạn số request/phút: để thấp)
app.ai.gemini.concurrency=${GEMINI_CONCURRENCY:2}
app.ai.gemini.max-attempts=3
app.ai.gemini.retry-backoff=1m
app.student.worker-interval=5s

# ===== Thông báo: push (FCM), chiến dịch, nhắc nhở =====
# Nội dung file JSON service account của Firebase (hoặc base64). Để trống = tắt push, vẫn có thông báo trong app + realtime
app.push.fcm.enabled=${FCM_ENABLED:false}
app.push.fcm.service-account-json=${FCM_SERVICE_ACCOUNT_JSON:}
app.notification.max-email-recipients=${NOTIFICATION_MAX_EMAIL_RECIPIENTS:2000}
app.notification.reminder-cron=0 5 * * * *
# Nhiều job định kỳ (worker AI, chiến dịch, gửi push, phát vị trí tàu...) → không dùng scheduler 1 luồng mặc định
spring.task.scheduling.pool.size=4
# SSE thông báo giữ kết nối tới 30 phút
spring.mvc.async.request-timeout=35m

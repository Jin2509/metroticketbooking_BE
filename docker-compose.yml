services:
  # Chỉ dùng khi muốn DB local: docker compose --profile local-db up -d. Mặc định dùng Neon theo DB_URL trong .env
  postgres:
    profiles: [local-db]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metroticket
      POSTGRES_USER: ${DB_USERNAME:-metroticket}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d metroticket"]
      interval: 5s
      retries: 10
    ports:
      # Đổi DB_PORT nếu máy đã có PostgreSQL chiếm cổng 5432
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

#  minio:
#    image: minio/minio:latest
#    restart: unless-stopped
#    command: server /data --console-address ":9001"
#    environment:
#      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
#      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
#    ports:
#      - "127.0.0.1:9000:9000"
#      - "127.0.0.1:9001:9001"
#    volumes:
#      - minio_data:/data

  backend:
    profiles: [app]
    build: .
    image: metroticket-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # DB nằm trên Neon, lấy từ .env. Thiếu DB_URL thì dừng ngay thay vì âm thầm nối nhầm DB
      DB_URL: ${DB_URL:?Cần đặt DB_URL trong .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      # File seed chứa mật khẩu nên không đóng vào image
      - ./seed:/app/seed:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  mailpit:
    profiles: [mailpit]
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  postgres_data:
  redis_data:
  minio_data: